<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spider-Man</title>
  <style>
    body { font: 1rem/1.6 system-ui, sans-serif; color: #192638; background: #edf1f6; margin: 0; padding: 2rem 1rem; }
    main { max-width: 38rem; margin: 0 auto; padding: clamp(1.25rem, 4vw, 2.5rem); background: white; border: 1px solid #cbd5e1; border-radius: 1rem; }
    h1 { line-height: 1.15; }
    img { display: block; width: 10rem; max-width: 100%; height: auto; border-radius: 1rem; }
    nav ul { display: flex; flex-wrap: wrap; gap: 1rem; list-style: none; padding: 0; }
    a { color: #124887; text-underline-offset: .2em; }
  </style>
</head>
<body>
  <main>
    <h1>Spider-Man</h1>
    <p>Peter Parker is a superhero who protects New York City.</p>
    <p>He climbs walls, swings through the city using web-shooters, and senses danger with his spider-sense.</p>
    <img src="spider-man.svg" alt="Illustration of Spider-Man's mask" width="160" height="160">
  </main>
</body>
</html>
